[project]
name = "rag-proj-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lalit7886", email = "lalitramanmishra@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-google-genai>=4.3.4",
    "langgraph>=1.2.11",
    "langsmith>=0.11.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "uvicorn>=0.52.3",
]

[project.scripts]
rag-proj-1 = "rag_proj_1:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
